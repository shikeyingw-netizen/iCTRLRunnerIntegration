name: Integrated iCTRL Runner Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          python3 --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build integrated Runner IPA
        shell: bash
        run: |
          set +e
          make ipa UNSIGNED=1 2>&1 | tee integrated-runner-build.log
          status=${PIPESTATUS[0]}
          {
            echo "## Integrated iCTRL Runner build"
            echo
            echo "Exit code: ${status}"
            echo
            echo '```text'
            tail -n 500 integrated-runner-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${status}"

      - name: Record package hashes
        if: success()
        shell: bash
        run: |
          shasum -a 256 \
            iCTRLUITests-Runner.ipa \
            iCTRL.ipa \
            | tee SHA256SUMS.txt

      - name: Upload official Runner IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-iCTRLUITests-Runner-unsigned
          path: |
            iCTRLUITests-Runner.ipa
            SHA256SUMS.txt

      - name: Upload companion IPA and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-iCTRL-build-evidence
          path: |
            iCTRL.ipa
            integrated-runner-build.log
          if-no-files-found: ignore

      - name: Publish build failure report
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/last-ictrl-build.txt"
          {
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Commit: ${GITHUB_SHA}"
            echo
            echo "## Matched diagnostics"
            grep -nE 'error:|fatal error:|failed|❌|warning:' integrated-runner-build.log \
              | tail -n 600 \
              || true
            echo
            echo "## Complete log tail"
            tail -n 800 integrated-runner-build.log || true
          } > "${report}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-reports
          git rm -rf .
          mkdir -p ci
          cp "${report}" ci/last-ictrl-build.txt
          git add ci/last-ictrl-build.txt
          git commit -m "Update official iCTRL build failure report [skip ci]"
          git push --force origin HEAD:ci-reports
